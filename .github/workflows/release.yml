name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v1
        with:
          swift-version: 6.0

      - name: Build
        run: make build

      - name: Create source artifact
        run: make release

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz \
            --title "shae-swift-macos-system-monitor ${{ github.ref_name }}" \
            --generate-notes
